services:
  mongodb:
    image: mongo@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: mongodb
    restart: unless-stopped
    networks:
    - infra-net
    - mongo-net
    ports:
    - 127.0.0.1:27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
    - mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: &id002
      - CMD-SHELL
      - mongosh --quiet --eval "db.adminCommand('ping')" || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    networks:
    - mongo-net
    ports:
    - 127.0.0.1:27018:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: 'false'
    logging: *id001
    healthcheck:
      test: *id002
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
volumes:
  mongo-data: null
networks:
  infra-net:
    external: true
  mongo-net: null