services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - 3010:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - <host-path>
      - <host-path>
    environment:
      - DOCKGE_STACKS_DIR=/opt/dockge/stacks
      - DOCKGE_IS_CONTAINER=1
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s