services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
    - 7878:7878
    volumes:
    - <host-path>
    - <host-path>
    - <host-path>
    environment:
    - PUID=1000
    - PGID=100
    - TZ=America/New_York
    networks:
    - infra-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '2.0'
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:7878/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
    - 8989:8989
    volumes:
    - <host-path>
    - <host-path>
    - <host-path>
    environment:
    - PUID=1000
    - PGID=100
    - TZ=America/New_York
    networks:
    - infra-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '2.0'
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8989/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
    - 9696:9696
    volumes:
    - <host-path>
    environment:
    - PUID=1000
    - PGID=100
    - TZ=America/New_York
    networks:
    - infra-net
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '2.0'
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9696/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  infra-net:
    external: true