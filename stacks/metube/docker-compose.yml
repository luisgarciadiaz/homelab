services:
  metube:
    image: alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    networks:
    - infra-net
    ports:
    - 8083:8081
    volumes:
    - <host-path>
    environment:
    - PUID=1000
    - PGID=1000
    - UMASK=022
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8083/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  infra-net:
    external: true