services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: no
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks:
    - infra-net
    ports:
    - 9000:9000
    volumes:
    - <host-path>
    - <host-path>
    - <host-path>
    environment:
    - SONAR_JDBC_URL=jdbc:postgresql://general-db:5432/sonarqube
    - SONAR_JDBC_USERNAME=sonarqube_user
    - SONAR_JDBC_PASSWORD=${SONAR_JDBC_PASSWORD}
    - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    - SONAR_TELEMETRY_ENABLE=false
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  infra-net:
    external: true