services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
    - infra-net
    ports:
    - 9090:9090
    volumes:
    - prometheus-data:/prometheus
    - <host-path>
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9090/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
    - infra-net
    ports:
    - 3004:3000
    volumes:
    - <host-path>
    - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging: *id001
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3004/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  prometheus-data:
    external: true
    name: monitoring_prometheus-data
  grafana-data:
    external: true
    name: monitoring_grafana-data
networks:
  infra-net:
    external: true