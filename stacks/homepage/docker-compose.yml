services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
    - infra-net
    ports:
    - 3002:3000
    volumes:
    - <host-path>
    - /var/run/docker.sock:/var/run/docker.sock
    group_add:
    - '982'
    environment:
    - HOMEPAGE_ALLOWED_HOSTS=192.168.0.0:3002
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  infra-net:
    external: true