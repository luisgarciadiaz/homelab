version: '3.8'
services:
  general-db:
    image: pgvector/pgvector:pg16
    container_name: general-db
    restart: unless-stopped
    ports:
    - 127.0.0.1:5433:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - general-db-data:/var/lib/postgresql/data
    networks:
    - infra-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  general-db-data: null
networks:
  infra-net:
    external: true