version: '3.8'
services:
  postgrest:
    image: postgrest/postgrest@sha256:bea1c76a856fa39d1e542d25911cf95d02fe2bf971992d033044ff209f1504b8
    container_name: vortexy_api
    restart: always
    ports:
    - 3000:3000
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
    networks:
    - infra-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  infra-net:
    external: true