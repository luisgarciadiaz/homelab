version: '3.8'
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
    - 8096:8096
    volumes:
    - <host-path>
    - <host-path>
    - <host-path>
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - curl --fail --silent --output /dev/null http://localhost:8096/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s