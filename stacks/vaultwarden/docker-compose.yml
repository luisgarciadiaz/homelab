services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    networks:
    - infra-net
    ports:
    - 8087:80
    volumes:
    - <host-path>
    environment:
    - TZ=America/Mexico_City
    - SIGNUPS_ALLOWED=false
    - DOMAIN=https://192.168.0.0:8087
    - ADMIN_TOKEN=${ADMIN_TOKEN}
    - ROCKET_TLS={certs="/data/ssl/vaultwarden.crt",key="/data/ssl/vaultwarden.key"}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8087/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  infra-net:
    external: true