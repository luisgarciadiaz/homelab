services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    networks:
    - infra-net
    ports:
    - 8090:8080
    volumes:
    - crowdsec_config:/etc/crowdsec
    - crowdsec_data:/var/lib/crowdsec/data
    - /var/log:/var/log:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
    - TZ=America/Mexico_City
    - COLLECTIONS=crowdsecurity/linux crowdsecurity/nginx
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - cscli metrics || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  crowdsec_config:
  crowdsec_data:

networks:
  infra-net:
    external: true
